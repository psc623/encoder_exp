workspace_root: /net/projects2/litian-lab/scpan
output_root: /net/projects2/litian-lab/scpan/encoders/artifacts
manifests:
  # Documentation only -- every command for this run passes --manifest
  # data/manifests/adni_full_mass.csv explicitly. Kept in sync so the config
  # is self-describing if read on its own.
  ad: /net/projects2/litian-lab/scpan/encoders/data/manifests/adni_full_mass.csv
  scz: /net/projects2/litian-lab/scpan/encoders/data/manifests/scz.csv
  bsnip2: /net/projects2/litian-lab/scpan/encoders/data/manifests/bsnip2_medsiglip.csv
checkpoints:
  medsiglip: /net/projects2/litian-lab/scpan/model_weights/medsiglip
  medgemma: /net/projects2/litian-lab/scpan/model_weights/medgemma
  braingemma3d: /net/projects2/litian-lab/scpan/model_weights/braingemma3D
  mass: /net/projects2/litian-lab/scpan/model_weights/MASS/mass_base.pth
  brainiac: /net/projects2/litian-lab/scpan/model_weights/brainIAC/BrainIAC.ckpt
  anatcl: /net/projects2/litian-lab/scpan/model_weights/AnatCL/global_fold0.pth
  synthseg: /net/projects2/litian-lab/scpan/dataset/ADNI_processed/synthseg_outputs
source_repositories:
  braingemma3d: /net/projects2/litian-lab/scpan/github_repo/BrainGemma3D
  mass: /net/projects2/litian-lab/scpan/github_repo/MASS
  brainiac: /net/projects2/litian-lab/scpan/github_repo/BrainIAC
  anatcl: /net/projects2/litian-lab/scpan/github_repo/AnatCL
data:
  split_seed: 0
  test_fraction: 0.5
  validation_fraction: 0.15
  axis: 2
  num_slices: 24
  slice_range: [0.15, 0.85]
  roi_fraction: 1.0
  low_percentile: 1.0
  high_percentile: 99.0
  volume_shapes:
    braingemma3d: [64, 128, 128]
    mass: [128, 128, 128]
    brainiac: [96, 96, 96]
    anatcl: [121, 128, 121]
    synthseg: [128, 128, 128]
features:
  # Unused for this run -- MASS is read with --native-tokens, which bypasses
  # _pool()/pooled_grid entirely (see extractors.py:_native). Left at the
  # frozen [4,4,4] shared value so config.py's cross-experiment validator
  # still passes unchanged.
  pooled_grid: [4, 4, 4]
  cache_dtype: float16
  layers:
    medsiglip: 9
    mass: 3
    brainiac: 10
    anatcl: 0
probe:
  seeds: [0, 1, 2]
  learning_rate: 0.001
  weight_decays: [0.0, 0.001, 0.01, 0.1, 1.0]
  max_epochs: 300
  batch_size: 32
  hidden_size: 128
finetune:
  seeds: [0, 1, 2]
  # The only change from config/default.yaml: no cap. MASS's layer-3 upstream
  # stack (inc + down1 + down2 + down3) totals a known 9,345,888 parameters
  # (RESULTS.md Group 3 table), so anything above that unfreezes every
  # upstream stage -- "all parameters", not a budgeted subset. down4 stays
  # frozen regardless: it's downstream of the layer-3 tap and gets no
  # gradient (see FrozenExtractor._stage_groups), same as every other run.
  parameter_budget: 999000000
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.001
  weight_decay: 0.01
  max_epochs: 12
  patience: 7
  gradient_accumulation: 8
  gradient_clip: 1.0
  hidden_size: 128
  precision: bf16
  synthseg_adapter_hidden_size: 4096
evaluation:
  bootstrap_samples: 2000
  bootstrap_seed: 0
  zero_shot_max_new_tokens: 128
