# Identical to default.yaml except checkpoints.synthseg, which must point at
# the BSNIP2 posteriors instead of ADNI's -- SynthSeg has no single shared
# checkpoint across datasets the way the other five encoders do (each dataset
# gets its own mri_synthseg run, see freesurfer_install/submit_synthseg_bsnip2.sh).
# Every other setting (seeds, budgets, epochs, split protocol, ...) is
# untouched so bsnip2:synthseg runs stay comparable to ad:synthseg and to the
# other bsnip2:<encoder> runs. config.py's _validate() enforces the frozen
# fields regardless.
workspace_root: /net/projects2/litian-lab/scpan
output_root: /net/projects2/litian-lab/scpan/encoders/artifacts
manifests:
  ad: /net/projects2/litian-lab/scpan/encoders/data/manifests/adni.csv
  scz: /net/projects2/litian-lab/scpan/encoders/data/manifests/scz.csv
  # Placeholder only: BSNIP2 preprocessing differs per encoder (BrainIAC/MASS
  # ran their own native raw pipeline, medsiglip got skull-strip only), so
  # there is no single shared bsnip2 manifest -- every cache/finetune command
  # passes --manifest explicitly (data/manifests/bsnip2_<encoder>.csv). This
  # key exists only so `disease in DISEASES` config paths that resolve a
  # default without an override don't 404.
  bsnip2: /net/projects2/litian-lab/scpan/encoders/data/manifests/bsnip2_synthseg.csv
checkpoints:
  medsiglip: /net/projects2/litian-lab/scpan/model_weights/medsiglip
  medgemma: /net/projects2/litian-lab/scpan/model_weights/medgemma
  braingemma3d: /net/projects2/litian-lab/scpan/model_weights/braingemma3D
  mass: /net/projects2/litian-lab/scpan/model_weights/MASS/mass_base.pth
  brainiac: /net/projects2/litian-lab/scpan/model_weights/brainIAC/BrainIAC.ckpt
  anatcl: /net/projects2/litian-lab/scpan/model_weights/AnatCL/global_fold0.pth
  synthseg: /net/projects2/litian-lab/scpan/dataset/bsnp2_final/synthseg_outputs
source_repositories:
  braingemma3d: /net/projects2/litian-lab/scpan/BrainGemma3D
  mass: /net/projects2/litian-lab/scpan/MASS
  brainiac: /net/projects2/litian-lab/scpan/BrainIAC
  anatcl: /net/projects2/litian-lab/scpan/AnatCL
data:
  split_seed: 0
  test_fraction: 0.5
  validation_fraction: 0.15
  axis: 2
  num_slices: 24
  slice_range: [0.15, 0.85]
  roi_fraction: 1.0
  low_percentile: 1.0
  high_percentile: 99.0
  volume_shapes:
    braingemma3d: [64, 128, 128]
    mass: [128, 128, 128]
    brainiac: [96, 96, 96]
    anatcl: [121, 128, 121]
    synthseg: [128, 128, 128]
features:
  pooled_grid: [4, 4, 4]
  cache_dtype: float16
  # Depth each frozen encoder is read at, indexing that encoder's taps ordered
  # shallow to deep; -1 is the deepest output (the original protocol). Chosen
  # per encoder by validation ROC-AUC in artifacts/audits/ad/layer_sweep.json.
  # synthseg is absent on purpose: its posteriors are precomputed on disk with no
  # forward pass to tap, and it is the untuned volumetry baseline rather than a
  # competing encoder. build_extractor rejects any layer but -1 for it.
  # Every encoder's best depth turned out to be an intermediate one, selected by
  # validation ROC-AUC (deepest-layer AUC in brackets): medsiglip 0.858 [0.812],
  # mass 0.870 [0.822], brainiac 0.808 [0.579], anatcl 0.691 [0.590].
  layers:
    medsiglip: 9
    mass: 3
    brainiac: 10
    anatcl: 0
probe:
  seeds: [0, 1, 2]
  learning_rate: 0.001
  weight_decays: [0.0, 0.001, 0.01, 0.1, 1.0]
  max_epochs: 300
  batch_size: 32
  hidden_size: 128
finetune:
  seeds: [0, 1, 2]
  # 8M rather than the original 16M. There are only 235 training volumes, so 16M
  # trainable parameters is ~68k per sample and close to guaranteed overfitting.
  # Complete blocks are never split, so each encoder still unfreezes at least one
  # whole block and its real count is recorded per run: this budget is what
  # decides whether a second block is added (it drops BrainIAC from 2 blocks to 1
  # and MASS from 4 stages to fewer). Below ~7M every encoder is pinned to its
  # single largest block and the budget stops having any effect.
  parameter_budget: 8000000
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.001
  weight_decay: 0.01
  # Was 5 (too few steps), then 30 (early stopping fired at 7-11 anyway). Capped
  # to 12 per direct instruction; run_finetune now also runs a train-vs-validation
  # overfitting check (encoderbench.training.detect_overfitting) and falls back to
  # the best validation checkpoint if it fires within this budget.
  max_epochs: 12
  patience: 7
  gradient_accumulation: 8
  gradient_clip: 1.0
  hidden_size: 128
  precision: bf16
  # SynthSeg has no differentiable segmentation parameters, so parameter_budget
  # above does not apply to it. Its finetune instead trains a small post-pooling
  # residual MLP (SynthSegPosteriorAdapter) over the 33-class posterior tokens.
  # Deliberately far below 8M: the adapter's input is a 33-dimensional
  # per-voxel probability simplex, so its capacity is rank-bounded by that 33
  # regardless of hidden width -- padding it out toward the shared backbone
  # budget would not add expressiveness, only overfitting risk on ~235 ADNI
  # training volumes. Same value used for both ad and bsnip2 so the two
  # SynthSeg finetune runs stay directly comparable to each other.
  synthseg_adapter_hidden_size: 4096
evaluation:
  bootstrap_samples: 2000
  bootstrap_seed: 0
  zero_shot_max_new_tokens: 128
