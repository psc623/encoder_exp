[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encoderbench"
version = "0.1.0"
description = "Frozen brain-MRI encoder, zero-shot VLM, and MedGemma bridge experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26,<2.3",
  "Pillow>=10",
  "PyYAML>=6",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "SimpleITK>=2.3",
  "einops>=0.8",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.53,<5",
  "monai==1.3.2",
  "accelerate>=1.2",
  "bitsandbytes>=0.46; platform_system == 'Linux'",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
encoderbench = "encoderbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
